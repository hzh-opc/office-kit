[project]
name = "office-kit"
version = "0.1.0"
description = "合并工具包：info-extract / desensitization-sop / summarize / doc-layout-aesthetics（单文件夹、uv 管理、按办公业务流程组织）"
requires-python = ">=3.10,<3.14"
dependencies = [
    "av>=11.0",
    "charset-normalizer>=3.0.0",
    "cryptography>=42.0.0",
    "faster-whisper>=1.0",
    "jieba>=0.42.1",
    "msoffcrypto-tool>=6.0.0",
    "numpy>=1.24",
    "onnxruntime>=1.19.0",
    "openpyxl>=3.1.0",
    "pikepdf>=9.11.0",
    "pillow>=10.0",
    "pypdfium2>=4.30.0",
    "python-docx>=1.1.0",
    "python-pptx>=0.6.23",
    "rapidocr>=3.9.0",
    "reportlab>=5.0.1",
]

[tool.uv]
package = false
